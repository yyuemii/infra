apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fae
  namespace: flux-system
spec:
  url: https://github.com/yyuemii/fae
  provider: github
  interval: 30m
  ref:
    branch: main
  secretRef:
    name: github-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-external-fae
  namespace: flux-system
spec:
  interval: 30m
  timeout: 2m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fae
    namespace: flux-system
  path: ./infra/production
